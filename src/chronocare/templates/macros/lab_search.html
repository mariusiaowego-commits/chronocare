{% macro lab_search(q='', input_id='lab-query', autofocus=false, person_id=None, person_name='') %}
<form method="get" action="/query" class="mb-6" data-lab-suggest-form>
    {% if person_id %}
    <input type="hidden" name="person_id" value="{{ person_id }}">
    {% endif %}
    <div class="flex gap-2 items-start">
        <div class="relative flex-1">
            <label class="sr-only" for="{{ input_id }}">查询化验指标</label>
            <input id="{{ input_id }}" type="search" name="q" value="{{ q }}"
                   autocomplete="off"
                   autocorrect="off"
                   spellcheck="false"
                   role="combobox"
                   aria-autocomplete="list"
                   aria-expanded="false"
                   aria-controls="{{ input_id }}-list"
                   data-lab-suggest-input
                   {% if not person_id %}disabled{% endif %}
                   placeholder="{% if person_name %}查询 {{ person_name }} 的指标，例如：胆固醇、肝功能{% else %}请先选择人员{% endif %}"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600
                          bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100
                          focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400
                          disabled:opacity-50 disabled:cursor-not-allowed"
                   {% if autofocus and person_id %}autofocus{% endif %}>
            <ul id="{{ input_id }}-list"
                data-lab-suggest-list
                hidden
                role="listbox"
                class="absolute z-30 mt-1 w-full max-h-80 overflow-auto rounded-xl border border-slate-200 dark:border-slate-600
                       bg-white dark:bg-slate-800 shadow-lg py-1"></ul>
        </div>
        <button type="submit"
                {% if not person_id %}disabled{% endif %}
                class="px-5 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-medium shadow-sm shrink-0
                       disabled:opacity-50 disabled:cursor-not-allowed">
            查询
        </button>
    </div>
</form>
{% endmacro %}
